<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学习时间统计</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      padding: 30px;
      width: 100%;
      max-width: 380px;
    }
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
      font-size: 24px;
    }
    .section {
      background: #f8f9fa;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .section-title {
      font-size: 14px;
      color: #666;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .timer-display {
      font-size: 48px;
      font-weight: bold;
      text-align: center;
      color: #667eea;
      margin: 20px 0;
      font-variant-numeric: tabular-nums;
    }
    .timer-display.break {
      color: #4caf50;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    button {
      padding: 12px 24px;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: 600;
    }
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }
    .btn-secondary {
      background: #e0e0e0;
      color: #333;
    }
    .btn-secondary:hover {
      background: #d0d0d0;
    }
    .btn-success {
      background: linear-gradient(135deg, #4caf50 0%, #45a049 100%);
      color: #fff;
    }
    .btn-success:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(76, 175, 80, 0.4);
    }
    .btn-danger {
      background: linear-gradient(135deg, #f44336 0%, #d32f2f 100%);
      color: #fff;
    }
    .btn-danger:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(244, 67, 54, 0.4);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 10px;
    }
    .stat-card {
      background: #fff;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
    }
    .stat-value {
      font-size: 28px;
      font-weight: bold;
      color: #667eea;
    }
    .stat-label {
      font-size: 12px;
      color: #999;
      margin-top: 5px;
    }
    .history-list {
      max-height: 200px;
      overflow-y: auto;
    }
    .history-item {
      display: flex;
      justify-content: space-between;
      padding: 10px;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }
    .history-item:last-child {
      border-bottom: none;
    }
    .history-date {
      color: #666;
    }
    .history-time {
      font-weight: bold;
      color: #667eea;
    }
    .pomodoro-settings {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      justify-content: center;
    }
    .setting-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .setting-item input {
      width: 60px;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 10px;
      text-align: center;
      font-size: 16px;
    }
    .setting-item label {
      font-size: 14px;
      color: #666;
    }
    .status-indicator {
      text-align: center;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 15px;
    }
    .status-working {
      background: rgba(102, 126, 234, 0.1);
      color: #667eea;
    }
    .status-break {
      background: rgba(76, 175, 80, 0.1);
      color: #4caf50;
    }
    .status-idle {
      background: #f0f0f0;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>学习时间统计</h1>

    <!-- 番茄钟 -->
    <div class="section">
      <div class="section-title">番茄钟</div>
      <div id="statusIndicator" class="status-indicator status-idle">准备开始</div>
      <div id="timerDisplay" class="timer-display">25:00</div>
      <div class="btn-group">
        <button id="startBtn" class="btn-primary" onclick="startTimer()">开始学习</button>
        <button id="pauseBtn" class="btn-secondary" onclick="pauseTimer()" disabled>暂停</button>
        <button id="resetBtn" class="btn-danger" onclick="resetTimer()">重置</button>
      </div>
      <div class="pomodoro-settings">
        <div class="setting-item">
          <label>工作</label>
          <input type="number" id="workTime" value="25" min="1" max="60">
          <label>分钟</label>
        </div>
        <div class="setting-item">
          <label>休息</label>
          <input type="number" id="breakTime" value="5" min="1" max="30">
          <label>分钟</label>
        </div>
      </div>
    </div>

    <!-- 学习统计 -->
    <div class="section">
      <div class="section-title">今日学习</div>
      <div class="stats-grid">
        <div class="stat-card">
          <div id="todayMinutes" class="stat-value">0</div>
          <div class="stat-label">分钟</div>
        </div>
        <div class="stat-card">
          <div id="todaySessions" class="stat-value">0</div>
          <div class="stat-label">个番茄钟</div>
        </div>
      </div>
    </div>

    <!-- 历史记录 -->
    <div class="section">
      <div class="section-title">学习记录</div>
      <div id="historyList" class="history-list">
        <div class="history-item">
          <span class="history-date">暂无记录</span>
          <span class="history-time"></span>
        </div>
      </div>
    </div>
  </div>

  <script>
    let timerInterval = null;
    let remainingSeconds = 25 * 60;
    let isRunning = false;
    let isBreak = false;
    let sessionCount = 0;
    let todayData = loadTodayData();

    function loadTodayData() {
      const today = new Date().toDateString();
      const data = JSON.parse(localStorage.getItem('studyData') || '{}');
      if (data.date !== today) {
        return { date: today, minutes: 0, sessions: 0 };
      }
      return data;
    }

    function saveData() {
      localStorage.setItem('studyData', JSON.stringify(todayData));
    }

    function updateDisplay() {
      const minutes = Math.floor(remainingSeconds / 60);
      const seconds = remainingSeconds % 60;
      document.getElementById('timerDisplay').textContent =
        `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    function updateStatus() {
      const indicator = document.getElementById('statusIndicator');
      indicator.className = 'status-indicator ' + (isBreak ? 'status-break' : (isRunning ? 'status-working' : 'status-idle'));
      indicator.textContent = isBreak ? '休息中' : (isRunning ? '学习中' : '准备开始');
    }

    function updateStats() {
      document.getElementById('todayMinutes').textContent = todayData.minutes;
      document.getElementById('todaySessions').textContent = todayData.sessions;
    }

    function updateHistory() {
      const history = JSON.parse(localStorage.getItem('studyHistory') || '[]');
      const list = document.getElementById('historyList');
      if (history.length === 0) {
        list.innerHTML = '<div class="history-item"><span class="history-date">暂无记录</span><span class="history-time"></span></div>';
        return;
      }
      list.innerHTML = history.slice(0, 10).map(item => `
        <div class="history-item">
          <span class="history-date">${item.date}</span>
          <span class="history-time">${item.minutes}分钟</span>
        </div>
      `).join('');
    }

    function startTimer() {
      if (isRunning) return;

      const workMinutes = parseInt(document.getElementById('workTime').value) || 25;
      const breakMinutes = parseInt(document.getElementById('breakTime').value) || 5;

      if (!isBreak && remainingSeconds === workMinutes * 60) {
        remainingSeconds = workMinutes * 60;
      }

      isRunning = true;
      document.getElementById('startBtn').disabled = true;
      document.getElementById('pauseBtn').disabled = false;

      timerInterval = setInterval(() => {
        remainingSeconds--;
        updateDisplay();

        if (remainingSeconds <= 0) {
          clearInterval(timerInterval);
          isRunning = false;

          if (!isBreak) {
            // 完成一个番茄钟
            todayData.minutes += workMinutes;
            todayData.sessions++;
            saveData();
            updateStats();
            saveToHistory(workMinutes);

            isBreak = true;
            remainingSeconds = breakMinutes * 60;
            document.getElementById('timerDisplay').classList.add('break');
            document.getElementById('startBtn').textContent = '开始休息';
          } else {
            // 休息结束
            isBreak = false;
            remainingSeconds = workMinutes * 60;
            document.getElementById('timerDisplay').classList.remove('break');
            document.getElementById('startBtn').textContent = '开始学习';
          }

          document.getElementById('startBtn').disabled = false;
          document.getElementById('pauseBtn').disabled = true;
          updateStatus();
          updateDisplay();
        }
      }, 1000);

      updateStatus();
    }

    function pauseTimer() {
      if (!isRunning) return;
      clearInterval(timerInterval);
      isRunning = false;
      document.getElementById('startBtn').disabled = false;
      document.getElementById('pauseBtn').disabled = true;
      updateStatus();
    }

    function resetTimer() {
      clearInterval(timerInterval);
      isRunning = false;
      isBreak = false;
      const workMinutes = parseInt(document.getElementById('workTime').value) || 25;
      remainingSeconds = workMinutes * 60;
      document.getElementById('startBtn').disabled = false;
      document.getElementById('pauseBtn').disabled = true;
      document.getElementById('startBtn').textContent = '开始学习';
      document.getElementById('timerDisplay').classList.remove('break');
      updateDisplay();
      updateStatus();
    }

    function saveToHistory(minutes) {
      const history = JSON.parse(localStorage.getItem('studyHistory') || '[]');
      const today = new Date().toLocaleDateString('zh-CN');
      const todayEntry = history.find(h => h.date === today);
      if (todayEntry) {
        todayEntry.minutes += minutes;
      } else {
        history.unshift({ date: today, minutes: minutes });
      }
      localStorage.setItem('studyHistory', JSON.stringify(history.slice(0, 30)));
      updateHistory();
    }

    // 初始化
    const workMinutes = parseInt(document.getElementById('workTime').value) || 25;
    remainingSeconds = workMinutes * 60;
    updateDisplay();
    updateStats();
    updateHistory();
  </script>
</body>
</html>
