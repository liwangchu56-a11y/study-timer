<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学习时间统计</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
    }
    .container {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      padding: 30px;
      width: 100%;
      max-width: 420px;
    }
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
      font-size: 24px;
    }
    .section {
      background: #f8f9fa;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .section-title {
      font-size: 14px;
      color: #666;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .timer-display {
      font-size: 48px;
      font-weight: bold;
      text-align: center;
      color: #667eea;
      margin: 15px 0;
      font-variant-numeric: tabular-nums;
    }
    .timer-display.running {
      color: #4caf50;
    }
    .timer-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin: 15px 0;
    }
    .reset-btn {
      background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
      border: 2px solid #ddd;
      border-radius: 50%;
      width: 48px !important;
      height: 48px !important;
      min-width: 48px !important;
      min-height: 48px !important;
      padding: 0 !important;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 26px;
      color: #888;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .reset-btn:hover {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-color: #667eea;
      transform: rotate(180deg);
      color: #fff;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }
    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    button {
      padding: 14px 28px;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: 600;
    }
    .btn-success {
      background: linear-gradient(135deg, #4caf50 0%, #45a049 100%);
      color: #fff;
    }
    .btn-success:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(76, 175, 80, 0.4);
    }
    .btn-danger {
      background: linear-gradient(135deg, #f44336 0%, #d32f2f 100%);
      color: #fff;
    }
    .btn-danger:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(244, 67, 54, 0.4);
    }
    .btn-secondary {
      background: #e0e0e0;
      color: #333;
    }
    .btn-secondary:hover {
      background: #d0d0d0;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    .stat-card {
      background: #fff;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
    }
    .stat-value {
      font-size: 28px;
      font-weight: bold;
      color: #667eea;
    }
    .stat-label {
      font-size: 12px;
      color: #999;
      margin-top: 5px;
    }
    .history-list {
      max-height: 200px;
      overflow-y: auto;
    }
    .history-item {
      display: flex;
      justify-content: space-between;
      padding: 10px;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }
    .history-item:last-child {
      border-bottom: none;
    }
    .history-date {
      color: #666;
    }
    .history-time {
      font-weight: bold;
      color: #667eea;
    }

    /* 番茄钟独立区块 */
    .pomodoro-section {
      background: #fff;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 20px;
      border: 2px solid #e0e0e0;
    }
    .pomodoro-section.active {
      border-color: #4caf50;
      background: #f8fff8;
    }
    .pomodoro-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .pomodoro-title {
      font-size: 16px;
      font-weight: 600;
      color: #333;
    }
    .pomodoro-status {
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 12px;
      background: #e0e0e0;
      color: #666;
    }
    .pomodoro-status.active {
      background: #4caf50;
      color: #fff;
    }
    .pomodoro-display {
      font-size: 36px;
      font-weight: bold;
      text-align: center;
      color: #4caf50;
      margin: 10px 0;
    }
    .pomodoro-display.paused {
      color: #999;
    }
    .pomodoro-settings {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 15px;
    }
    .pomodoro-settings input {
      width: 60px;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 10px;
      text-align: center;
      font-size: 14px;
    }
    .pomodoro-settings label {
      font-size: 14px;
      color: #666;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .pomodoro-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #4caf50 0%, #45a049 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
    }
    .pomodoro-btn:hover {
      transform: translateY(-1px);
    }
    .pomodoro-btn.stop {
      background: linear-gradient(135deg, #f44336 0%, #d32f2f 100%);
    }

    .status-bar span {
      color: #667eea;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>学习时间统计</h1>

    <!-- 主计时器 -->
    <div class="section">
      <div class="section-title">学习中</div>
      <div id="timerDisplay" class="timer-display">00:00:00</div>
      <div class="btn-group">
        <button id="startBtn" class="btn-success" onclick="startTimer()">开始学习</button>
        <button id="stopBtn" class="btn-danger" onclick="stopTimer()" disabled>暂停</button>
      </div>
      <div style="text-align:center;margin-top:15px;">
        <a href="stats.html" style="color:#667eea;font-size:14px;text-decoration:none;">查看统计 &rarr;</a>
      </div>
    </div>

    <!-- 番茄钟 (独立功能) -->
    <div id="pomodoroSection" class="pomodoro-section">
      <div class="pomodoro-header">
        <span class="pomodoro-title">番茄钟</span>
        <span id="pomodoroStatus" class="pomodoro-status">未开始</span>
      </div>
      <div id="pomodoroDisplay" class="pomodoro-display">25:00</div>
      <div class="pomodoro-settings">
        <label>学习 <input type="number" id="workTime" value="25" min="1" max="120"> 分钟</label>
        <label>休息 <input type="number" id="breakTime" value="5" min="1" max="30"> 分钟</label>
      </div>
      <button id="pomodoroBtn" class="pomodoro-btn" onclick="togglePomodoro()">启动番茄钟</button>
    </div>

    <!-- 悬浮窗口开关 -->
    <div style="text-align:center;margin-top:10px;">
      <label style="display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;color:#666;">
        <input type="checkbox" id="floatingToggle" onchange="toggleFloating()">
        显示悬浮计时
      </label>
    </div>

  </div>

  <script>
    // ==================== 主计时器 ====================
    let timerInterval = null;
    let elapsedSeconds = parseInt(localStorage.getItem('currentSessionSeconds') || '0');
    let isRunning = false;

    // ==================== 番茄钟 ====================
    let pomodoroInterval = null;
    let pomodoroSeconds = 25 * 60;
    let pomodoroRunning = false;
    let isBreakTime = false;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playSound() {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = 800;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 0.5);
    }

    // ==================== 主计时器函数 ====================
    function startTimer() {
      if (isRunning) return;

      // 清除旧interval（如果有）
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }

      isRunning = true;
      localStorage.setItem('isRunning', 'true');
      document.getElementById('startBtn').disabled = true;
      document.getElementById('stopBtn').disabled = false;
      document.getElementById('timerDisplay').classList.add('running');

      timerInterval = setInterval(() => {
        elapsedSeconds++;
        localStorage.setItem('currentSessionSeconds', elapsedSeconds);
        updateMainDisplay();
      }, 1000);
    }

    function stopTimer() {
      if (!isRunning) return;
      clearInterval(timerInterval);
      timerInterval = null;
      isRunning = false;
      localStorage.setItem('isRunning', 'false');
      document.getElementById('startBtn').disabled = false;
      document.getElementById('stopBtn').disabled = true;
      document.getElementById('timerDisplay').classList.remove('running');

      // 暂停时保存当前计时并更新统计
      localStorage.setItem('currentSessionSeconds', elapsedSeconds);
      if (elapsedSeconds >= 60) {
        saveCurrentSession(false); // 不重置elapsedSeconds
      }
    }

    function resetTimer() {
      // 保存当前计时再重置
      if (elapsedSeconds >= 60) {
        saveCurrentSession();
      }
      clearInterval(timerInterval);
      timerInterval = null;
      isRunning = false;
      localStorage.setItem('isRunning', 'false');
      elapsedSeconds = 0;
      localStorage.removeItem('currentSessionSeconds');
      document.getElementById('startBtn').disabled = false;
      document.getElementById('stopBtn').disabled = true;
      document.getElementById('timerDisplay').classList.remove('running');
      updateMainDisplay();
    }

    function updateMainDisplay() {
      const h = Math.floor(elapsedSeconds / 3600);
      const m = Math.floor((elapsedSeconds % 3600) / 60);
      const s = elapsedSeconds % 60;
      document.getElementById('timerDisplay').textContent =
        `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    // ==================== 番茄钟函数 ====================
    function togglePomodoro() {
      if (pomodoroRunning) {
        // 停止番茄钟 - 同时停止主计时器
        clearInterval(pomodoroInterval);
        pomodoroInterval = null;
        pomodoroRunning = false;
        isBreakTime = false;
        document.getElementById('pomodoroSection').classList.remove('active');
        document.getElementById('pomodoroStatus').classList.remove('active');
        document.getElementById('pomodoroStatus').textContent = '未开始';
        document.getElementById('pomodoroBtn').textContent = '启动番茄钟';
        document.getElementById('pomodoroBtn').classList.remove('stop');
        pomodoroSeconds = (parseInt(document.getElementById('workTime').value) || 25) * 60;
        updatePomodoroDisplay();

        // 停止番茄钟 - 同时停止主计时器
        clearInterval(pomodoroInterval);
        pomodoroInterval = null;
        pomodoroRunning = false;
        isBreakTime = false;
        document.getElementById('pomodoroSection').classList.remove('active');
        document.getElementById('pomodoroStatus').classList.remove('active');
        document.getElementById('pomodoroStatus').textContent = '未开始';
        document.getElementById('pomodoroBtn').textContent = '启动番茄钟';
        document.getElementById('pomodoroBtn').classList.remove('stop');
        pomodoroSeconds = (parseInt(document.getElementById('workTime').value) || 25) * 60;
        updatePomodoroDisplay();

        // 停止主计时器 - 先保存时间
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }
        // 保存当前计时（>=60秒才计入统计）
        if (elapsedSeconds > 0) {
          saveCurrentSession(false); // 不重置elapsedSeconds
        }
        isRunning = false;
        // 保留elapsedSeconds和localStorage，以便重新打开可以继续
        document.getElementById('startBtn').disabled = false;
        document.getElementById('stopBtn').disabled = true;
        document.getElementById('timerDisplay').classList.remove('running');
        updateMainDisplay();
        updatePomodoroDisplay();
      } else {
        // 开始番茄钟 - 同时启动主计时器
        pomodoroRunning = true;
        isBreakTime = false;
        document.getElementById('pomodoroSection').classList.add('active');
        document.getElementById('pomodoroStatus').classList.add('active');
        document.getElementById('pomodoroStatus').textContent = '学习中';
        document.getElementById('pomodoroBtn').textContent = '停止番茄钟';
        document.getElementById('pomodoroBtn').classList.add('stop');

        const workMinutes = parseInt(document.getElementById('workTime').value) || 25;
        pomodoroSeconds = workMinutes * 60;
        updatePomodoroDisplay();

        // 自动启动主计时器
        if (!isRunning) {
          startTimer();
        }

        pomodoroInterval = setInterval(() => {
          pomodoroSeconds--;
          updatePomodoroDisplay();

          if (pomodoroSeconds <= 0) {
            // 番茄钟计时器到0时，先保存主计时器的时间
            if (elapsedSeconds >= 60) {
              saveCurrentSession();
            }
            playSound();
            if (!isBreakTime) {
              // 学习完成，进入休息 - 暂停主计时器
              isBreakTime = true;
              const breakMinutes = parseInt(document.getElementById('breakTime').value) || 5;
              pomodoroSeconds = breakMinutes * 60;
              document.getElementById('pomodoroStatus').textContent = '休息中';
              // 暂停主计时器
              if (isRunning) {
                clearInterval(timerInterval);
                timerInterval = null;
                isRunning = false;
                document.getElementById('startBtn').disabled = false;
                document.getElementById('stopBtn').disabled = true;
                document.getElementById('timerDisplay').classList.remove('running');
              }
            } else {
              // 休息完成，开始新番茄钟 - 重新启动主计时器
              isBreakTime = false;
              const workMinutes = parseInt(document.getElementById('workTime').value) || 25;
              pomodoroSeconds = workMinutes * 60;
              document.getElementById('pomodoroStatus').textContent = '学习中';
              startTimer();
            }
          }
        }, 1000);
      }
    }

    function updatePomodoroDisplay() {
      const m = Math.floor(pomodoroSeconds / 60);
      const s = pomodoroSeconds % 60;
      const display = document.getElementById('pomodoroDisplay');
      display.textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      display.classList.toggle('paused', !pomodoroRunning);
    }

    // ==================== 数据保存 (每天结束时) ====================
    function getToday() {
      return new Date().toLocaleDateString('zh-CN');
    }

    function checkDayChange() {
      const lastDate = localStorage.getItem('lastStudyDate');
      const today = getToday();
      if (lastDate && lastDate !== today) {
        // 新的一天，昨天的数据已经在saveDailyData中处理
      }
      localStorage.setItem('lastStudyDate', today);
    }

    function saveDailyData() {
      // 只在学习时长>=1分钟时保存
      if (elapsedSeconds >= 60) {
        const minutes = Math.round(elapsedSeconds / 60);
        const today = getToday();
        const history = JSON.parse(localStorage.getItem('studyHistory') || '[]');

        const todayEntry = history.find(h => h.date === today);
        if (todayEntry) {
          todayEntry.minutes += minutes;
          todayEntry.count++;
        } else {
          history.unshift({ date: today, minutes: minutes, count: 1 });
        }

        localStorage.setItem('studyHistory', JSON.stringify(history.slice(0, 30)));
        elapsedSeconds = 0; // 重置计时
      }
    }

    function saveCurrentSession(resetElapsed = true) {
      // 保存当前计时
      if (elapsedSeconds >= 60) {
        const minutes = Math.round(elapsedSeconds / 60);
        const today = getToday();
        const history = JSON.parse(localStorage.getItem('studyHistory') || '[]');

        const todayEntry = history.find(h => h.date === today);
        if (todayEntry) {
          todayEntry.minutes += minutes;
          todayEntry.count++;
        } else {
          history.unshift({ date: today, minutes: minutes, count: 1 });
        }

        localStorage.setItem('studyHistory', JSON.stringify(history.slice(0, 30)));
        if (resetElapsed) {
          elapsedSeconds = 0;
          localStorage.removeItem('currentSessionSeconds');
        }
      }
    }

    // 页面离开时保存
    window.addEventListener('beforeunload', () => {
      if (isRunning || elapsedSeconds > 0) {
        saveDailyData();
      }
    });

    // 每天零点保存（通过比较日期）
    setInterval(() => {
      checkDayChange();
    }, 60000); // 每分钟检查一次

    // ==================== 初始化 ====================
    checkDayChange();
    updateMainDisplay();
    updatePomodoroDisplay();

    // 初始化悬浮窗口开关
    document.getElementById('floatingToggle').checked = true;

    // 检查浮窗是否被关闭
    let lastFloatingClosed = 0;
    setInterval(() => {
      const closedTime = localStorage.getItem('floatingClosed');
      if (closedTime && parseInt(closedTime) > lastFloatingClosed) {
        lastFloatingClosed = parseInt(closedTime);
        document.getElementById('floatingToggle').checked = false;
      }
    }, 500);

    function toggleFloating() {
      const checked = document.getElementById('floatingToggle').checked;
      if (checked) {
        window.electronAPI.createFloatingWindow();
      } else {
        window.electronAPI.closeFloatingWindow();
      }
    }
  </script>
</body>
</html>
